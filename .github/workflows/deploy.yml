name: Deploy to Proxmox LXC

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # Notice the "Setup .NET" step is completely gone! 
      # It jumps straight from checking out the code to publishing it.

      - name: Publish App
        run: dotnet publish ./TaskApp/TaskApp.csproj -c Release -r linux-x64 --self-contained true -o ./publish_output

      - name: Stop Service
        run: sudo systemctl stop taskapp

      - name: Copy Files
        run: rsync -av --delete --exclude='tasks.db*' ./publish_output/ /var/www/taskapp/

      - name: Start Service
        run: sudo systemctl start taskapp