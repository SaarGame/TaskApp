name: Deploy to Proxmox LXC

on:
  push:
    # Triggers on both common branch names just to be safe
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish App
        # FIX 1: Point directly to the API project file so the Solution file is ignored
        run: dotnet publish ./TaskApp.Api/TaskApp.Api.csproj -c Release -r linux-x64 --self-contained true -o ./publish_output

      - name: Stop Service
        run: sudo systemctl stop taskapp

      - name: Copy Files
        # FIX 2 & 3: Added --delete to clean up old files, and tasks.db* (with asterisk) to protect SQLite logs
        run: rsync -av --delete --exclude='tasks.db*' ./publish_output/ /var/www/taskapp/

      - name: Start Service
        run: sudo systemctl start taskapp